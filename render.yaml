# Render Blueprint -- deploys the dashboard as a web service on stocksense.in.
#
# Native Python runtime rather than Docker: Streamlit needs no system packages
# beyond what Render's Python image already has, and a Dockerfile would only
# add build time.
#
# Free hosting: no persistent disk. Runtime files reset on restart/spin-down.
# The 512 MB memory limit must be checked with a live forecast before launch.
services:
  - type: web
    name: stocksense
    runtime: python
    plan: free
    region: singapore          # closest to the Indian market data sources
    branch: main
    buildCommand: pip install -r requirements-render.txt && python prepare_web_assets.py
    startCommand: >
      streamlit run dashboard.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS true
      --server.enableXsrfProtection true
      --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
